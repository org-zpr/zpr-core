[package]
name = "libnode2"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
capnp = { workspace = true }
capnp-rpc = { workspace = true }
clap = { workspace = true, optional = true }
ipnet = { workspace = true }
openssl = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, optional = true }
zpr = { workspace = true }

crossterm = { version = "0.28", optional = true } # lnt
ratatui = { version = "0.29", optional = true } # lnt
tui-input = { version = "0.10", features = ["crossterm"], optional = true } # lnt
tokio-rustls = "0.26.4"
rustls = "0.23.36"
rcgen = "0.14.7"


[features]
build-lnt = ["clap", "tracing-subscriber", "ratatui", "crossterm", "tui-input"]

[[bin]]
name = "lntest"
path = "src/bin/lntest.rs"
required-features = ["build-lnt"]
