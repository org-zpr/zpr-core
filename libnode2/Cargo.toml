[package]
name = "libnode2"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
capnp-rpc = "0.23.0"
capnp = "0.23.0"
vsapi = { git = "https://github.com/org-zpr/zpr-vsapi-rs.git", tag = "v0.6.0", features = ["v2"] }
thiserror = "2.0.17"
tracing = "0.1.41"
tokio = { version = "1.48.0", features = ["full"] }
zpr = { path = "../zpr" }
tokio-util = { version = "0.7.17", features = ["rt", "compat"] }
openssl = "0.10.74"

