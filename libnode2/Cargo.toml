[package]
name = "libnode2"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aws-lc-rs = "1.17"
capnp = { workspace = true }
capnp-rpc = { workspace = true }
clap = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, optional = true }
zpr = { workspace = true }
rand = "0.9.3"
x509-cert = "0.3.0"

crossterm = { version = "0.29", optional = true } # lnt
ratatui = { version = "0.30", optional = true } # lnt
tui-input = { version = "0.15", features = ["crossterm"], optional = true } # lnt
tokio-rustls = "0.26.4"
rustls = "0.23.36"
rcgen = "0.14.7"

[features]
build-lnt = ["clap", "tracing-subscriber", "ratatui", "crossterm", "tui-input"]

[[bin]]
name = "lntest"
path = "src/bin/lntest.rs"
required-features = ["build-lnt"]
