[package]
name = "cbpf-rs"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
pcap = { version = "2.0.0", optional = true }
arbitrary = { version = "1", optional = true, features = ["derive"] }

[dev-dependencies]
pcap = { version = "2.0.0" }

[features]
pcap = ["dep:pcap"]
arbitrary = ["dep:arbitrary"]
