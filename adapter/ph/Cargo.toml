[package]
name = "ph"
version = "0.1.0"
edition = "2021"

[dependencies]
arrayref = { version = "0.3.7" }
bytes = { version = "1.7.1" }
cbpf-rs = { path = "../../cbpf-rs", features = ["pcap"] }
clap = { version = "4.5.7", features = ["derive"] }
enum-map = { version = "2.7.3" }
foreign-types = { version = "0.3.2" }
hdrhistogram = { version = "7.5.4" }
libc = { version = "0.2.155" }
nix = { version = "0.29.0", features = ["fs", "ioctl", "net", "socket", "uio"] }
open-enum = { version = "0.5.1" }
openssl-sys = { version = "0.9.102" }
openssl = { version = "0.10.64" }
pcap = { version = "2.0.0" }
tokio-openssl = { version = "0.6.4" }
tokio-tun = { version = "0.11.5" }
tokio = { version = "1.37.0", features = ["full"] }
zerocopy-derive = { version = "0.7.34" }
zerocopy = { version = "0.7.34", features = ["byteorder"] }
tokio-util = { version = "0.7.11", features = ["rt"] }
tracing = "0.1.40"
zpr-ext = { path = "../../zpr-ext", features = ["bytes", "tokio", "tokio-tun", "zerocopy"] }

[features]
ci = []

[lib] 
test = false
