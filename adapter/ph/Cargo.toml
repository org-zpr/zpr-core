[package]
name = "ph"
version = "0.5.0"
edition = "2021"

[dependencies]
aarc = { version = "0.2.1", optional = true }
arrayref = { version = "0.3.7" }
base64 = "0.22.1"
blake3 = { version = "1.5.4" }
bytes = { version = "1.7.1" }
cbpf-rs = { path = "../../cbpf-rs" }
clap = { version = "4.5.7", features = ["derive"] }
crossbeam-epoch = { version = "0.9.18", optional = true }
cslab = { path = "../../cslab" }
curve25519-dalek = "4.1.3"
dashmap = { version = "6.0.1" }
enum-map = { version = "2.7.3" }
hdrhistogram = { version = "7.5.4" }
libc = { version = "0.2.155" }
open-enum = { version = "0.5.1" }
openssl-sys = { version = "0.9.102" }
openssl = { version = "0.10.64" }
snow = "0.9.6"
socket2 = { version = "0.5.7" }
tokio-util = { version = "0.7.11", features = ["rt"] }
tokio = { version = "1.37.0", features = ["full"] }
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
zerocopy = { version = "0.8.3", features = ["derive", "std"] }
zpr = { path = "../../zpr" }
nix = { version = "0.29.0", features = ["ioctl", "net"] }
thiserror = "1.0.65"
zpr-ext = { path = "../../zpr-ext", features = ["bytes", "tokio", "zerocopy"] }

[target.'cfg(target_os = "linux")'.dependencies]
tokio-tun = { version = "0.11.5" }

[target.'cfg(target_os = "macos")'.dependencies]
# This is used for its ability to manage a TUN device on mac.
# Locked at 0.7.1 just so we are sure to track what is happening
# in this project. There were some features in v0.6.1 that we
# may need going forward.
tun = { version = "=0.7.1", features = ["async"] }


[dev-dependencies]

[features]
default = ["rcu-crossbeam-epoch"]
ci = []
rcu-rwlock = []
rcu-mutex-arc = []
rcu-crossbeam-epoch = ["dep:crossbeam-epoch"]
rcu-aarc = ["dep:aarc"]

[lib]
test = false
