[package]
name = "ph-test"
version = "0.1.0"
edition = "2021"

[dependencies]
arrayref = { version = "0.3.7" }
bytes = { version = "1.6.0" }
clap = { version = "4.5.7", features = ["derive"] }
enum-map = { version = "2.7.3" }
