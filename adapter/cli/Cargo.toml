[package]
name = "ph-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
admin-api = { path = "../admin-api" }
capnp = { workspace = true }
capnp-rpc = { workspace = true }
cbpf-rs = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true, optional = true }
ctrlc = { version = "3.4.4" }
pcap = { workspace = true, optional = true }
shlex = { version = "1.3.0" }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
zpr-ext = { workspace = true, features = ["bytes", "tokio", "zerocopy"] }
rustyline = { version = "17.0.2", features = ["derive"] }
dirs = "6.0.0"

[target.'cfg(unix)'.dependencies]
capnp-patched = { package = "capnp", git = "https://github.com/emilazy/capnproto-rust.git", rev = "cfbcb9b", optional = true }
capnp-rpc-patched = { package = "capnp-rpc", git = "https://github.com/emilazy/capnproto-rust.git", rev = "cfbcb9b", optional = true }
capnp-futures-patched = { package = "capnp-futures", git = "https://github.com/emilazy/capnproto-rust.git", rev = "cfbcb9b", optional = true }

[features]
default = ["pcap", "capnp-ancillary"]
pcap = ["dep:pcap", "cbpf-rs/pcap"]
complete = ["clap_complete"]
capnp-ancillary = [
    "dep:capnp-patched",
    "dep:capnp-rpc-patched",
    "dep:capnp-futures-patched",
    "admin-api/capnp-ancillary",
    "capnp-futures-patched/tokio-unix-fd-stream",
]

[[bin]]
name = "ph-cli"
path = "src/main.rs"

[[bin]]
name = "generate_completions"
path = "src/generate_completions.rs"
required-features = ["complete"]
