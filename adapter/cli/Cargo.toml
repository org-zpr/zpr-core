[package]
name = "ph-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
admin-api = { path = "../admin-api" }
capnp = { workspace = true }
capnp-rpc = { workspace = true }
cbpf-rs = { workspace = true, features = ["pcap"]}
clap = { workspace = true }
clap_complete = { workspace = true, optional = true }
ctrlc = { version = "3.4.4" }
pcap = { workspace = true }
shlex = { version = "1.3.0" }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
zpr-ext = { workspace = true, features = ["bytes", "tokio", "zerocopy"] }
rustyline = "17.0.2"
dirs = "6.0.0"

[features]
complete = ["clap_complete"]

[[bin]]
name = "ph-cli"
path = "src/main.rs"

[[bin]]
name = "generate_completions"
path = "src/generate_completions.rs"
required-features = ["complete"]
