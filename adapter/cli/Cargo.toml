[package]
name = "ph-cli"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
capnp-rpc = { version = "0.23" }
capnp = { version = "0.23" }
cbpf-rs = { path = "../../cbpf-rs", features = ['pcap'] }
clap_complete = { version = "4.5.57", optional = true}
clap = { version = "4.5.7", features = ["derive"] }
ctrlc = { version = "3.4.4" }
pcap = { version = "2.0.0" }
shlex = { version = "1.3.0" }
thiserror = { version = "2.0.17" }
tokio-util = { version = "0.7.11", features = ["compat"] }
tokio = { version = "1.37.0", features = ["macros", "rt", "io-util", "time"] }
zpr-ext = { path = "../../zpr-ext", features = ["bytes", "tokio", "zerocopy"] }
zpr = { git = "https://github.com/org-zpr/zpr.git", tag = "v0.1.0", features = ["admin-api"] }

[features]
complete = ["clap_complete"]

[[bin]]
name = "ph-cli"
path = "src/main.rs"

[[bin]]
name = "generate_completions"
path = "src/generate_completions.rs"
required-features = ["complete"]