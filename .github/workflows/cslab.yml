name: Rust-cslab

on:
  push:
    branches: [ "main" ]
    paths:
      - 'cslab/**'
      - '.github/workflows/cslab.yml'
  pull_request:
    paths:
      - 'cslab/**'
      - '.github/workflows/cslab.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  cslab-build:
    name: Cslab
    uses: org-zpr/zpr-dev-tools/.github/workflows/rust-build-test.yml@v1
    with:
      name: 'Cslab'
      path: './cslab'
    secrets: inherit
