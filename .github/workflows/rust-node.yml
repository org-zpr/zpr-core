name: Rust-node

on:
  push:
    branches: [ "main" ]
  pull_request:
    paths: 
      - node/**
      - visaservice/thrift/**
      - adapter/ph/**
      - zpr-ext/**

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: |
        cd node
        cargo build --verbose
    - name: Run tests
      run: |
        cd node
        cargo test --verbose
