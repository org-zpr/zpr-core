name: Rust-node

on:
  push:
    branches: [ "main" ]
  pull_request:
    paths: 
      - node/**
      - visaservice/thrift/**
      - adapter/ph/**
      - zpr-ext/**
      - cslab/**
      - cbpf-rs/**

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Build
      run: |
        cd node && make all

    - name: Run tests
      run: |
        cd node && make test

