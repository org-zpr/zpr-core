name: Rust-node

on:
  push:
    branches: [ "main" ] # need change for test
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cd node && cargo build --verbose
    - name: Run tests
      run: cd node && cargo test --verbose
