name: Rust-node

on:
  push:
    branches: [ "main" ]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: setup 
      run: sudo apt update -y && sudo apt install -y libpcap-dev 
    - name: Build
      run: cd node && cargo build --verbose
    - name: Run tests
      run: cd node && cargo test --verbose
