name: Rust-node

on:
  push:
    branches: [ "main" ]
  pull_request:
    paths: 
      - 'libnode/**'
      - 'visaservice/thrift/**'
      - 'adapter/ph/**'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: docker://ghcr.io/org-zpr/38f3bb925e5e:latest
    steps:
    - uses: actions/checkout@v4

    - name: Prepare Rust
      run: rustup default stable

    - name: Build libnode
      run: |
        cd libnode && make all

    - name: Run tests
      run: |
        cd libnode && make test

