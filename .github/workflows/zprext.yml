name: Rust-zprext

on:
  push:
    branches: [ "main" ]
    paths:
      - 'zpr-ext/**'
      - '.github/workflows/zprext.yml'
  pull_request:
    paths:
      - 'zpr-ext/**'
      - '.github/workflows/zprext.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  zpr-ext:
    name: ZPR Ext
    uses: org-zpr/zpr-dev-tools/.github/workflows/rust-build-test.yml@5b48a89e4fba1551d44f052d5495bc0083939aa6
    with:
      name: 'ZPR-Ext'
      path: './zpr-ext'
    secrets: inherit
