name: Rust-zprext

on:
  push:
    branches: [ "main" ]
  pull_request:
    paths: 
      - 'zpr-ext/**'
      - '.github/workflows/rust-zprext.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  zpr-ext-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build + test cbpf
      timeout-minutes: 5
      run: |
        cd zpr-ext
        cargo build --verbose
        cargo test --verbose

  zpr-ext-format:
    needs: [zpr-ext-build]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Check format
      timeout-minutes: 5
      run: |
        cd zpr-ext
        cargo fmt --check

  zpr-ext-warnings:
    needs: [zpr-ext-build]
    runs-on: ubuntu-latest
    steps: 
    - uses: actions/checkout@v4
    - name: Check warnings
      timeout-minutes: 5
      run: |
        cd zpr-ext
        cargo rustc -- -D warnings

  zpr-ext-test-warnings:
    needs: [zpr-ext-build]
    runs-on: ubuntu-latest
    steps: 
    - uses: actions/checkout@v4
    - name: Check test warnings
      timeout-minutes: 5
      run: |
        cd zpr-ext
        cargo rustc --tests -- -D warnings
