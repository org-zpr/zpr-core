name: Rust-adapter

on:
  push:
    branches: [ "main" ]
  pull_request:
    paths:
      - 'adapter/ph/**'
      - 'adapter/ph-debug/**'
      - 'zpr-ext/**'
      - 'cslab/**'
      - 'cbpf-rs/**'
      - '.github/workflows/rust-adapter.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Tests for ph
  ph-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build + test ph
      timeout-minutes: 5
      run: |
        sudo apt update
        sudo apt install thrift-compiler
        make ph
        cd adapter/ph
        make test

  ph-format:
    needs: [ph-build]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Check format
      timeout-minutes: 5
      run: |
        cd adapter/ph
        cargo fmt --check

  ph-warnings:
    needs: [ph-build]
    runs-on: ubuntu-latest
    steps: 
    - uses: actions/checkout@v4
    - name: Check warnings 
      timeout-minutes: 5
      run: |
        cd adapter/ph 
        cargo rustc --bin ph -- -D warnings

  ph-test-warnings:
    needs: [ph-build]
    runs-on: ubuntu-latest
    steps: 
    - uses: actions/checkout@v4
    - name: Check test warnings
      timeout-minutes: 5
      run: | 
        cd adapter/ph
        cargo rustc --tests -- -D warnings
  
  # Tests for ph-debug
  ph-debug-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build + test ph
      timeout-minutes: 5
      run: |
        sudo apt update
        sudo apt install libpcap-dev
        cd adapter/ph-debug && cargo build --verbose
        cargo test --verbose

  ph-debug-format:
    needs: [ph-debug-build]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Check format
      timeout-minutes: 5
      run: |
        cd adapter/ph-debug
        cargo fmt --check

  ph-debug-warnings:
    needs: [ph-debug-build]
    runs-on: ubuntu-latest
    steps: 
    - uses: actions/checkout@v4
    - name: Check warnings 
      timeout-minutes: 5
      run: |
        sudo apt update
        sudo apt install libpcap-dev
        cd adapter/ph-debug && cargo rustc -- -D warnings

  ph-debug-test-warnings:
    needs: [ph-debug-build]
    runs-on: ubuntu-latest
    steps: 
    - uses: actions/checkout@v4
    - name: Check test warnings
      timeout-minutes: 5
      run: |
        sudo apt update
        sudo apt install libpcap-dev
        cd adapter/ph-debug && cargo rustc --tests -- -D warnings

  # Integration tests
  basic-integration-test:
    needs: [ph-build, ph-debug-build]
    runs-on: ubuntu-latest
    steps: 
    - uses: actions/checkout@v4
    - name: Check test warnings
      timeout-minutes: 5
      run: |
        cd adapter/ph
        cargo build
        sudo apt update
        sudo apt install libpcap-dev
        cargo build --manifest-path ../ph-debug/Cargo.toml
        ZPR_TEST_VERBOSE=1 test/basic-test.sh

  capture-integration-test:
    needs: [ph-build, ph-debug-build]
    runs-on: ubuntu-latest
    steps: 
    - uses: actions/checkout@v4
    - name: Check test warnings
      timeout-minutes: 5
      run: |
        cd adapter/ph
        cargo build
        sudo apt update
        sudo apt install libpcap-dev
        cargo build --manifest-path ../ph-debug/Cargo.toml
        ZPR_TEST_VERBOSE=1 test/capture-test.sh
