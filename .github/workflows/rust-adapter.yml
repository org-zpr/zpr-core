name: Rust-adapter

on:
  push:
    branches: [ "main" ]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  cd-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build + test cd
      run: |
        cd adapter/cd
        make build
        make test

  cd-format:
    needs: [cd-build]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Check format
      run: | 
        cd adapter/cd
        cargo fmt --check

  cd-warnings:
    needs: [cd-build]
    runs-on: ubuntu-latest
    steps: 
    - uses: actions/checkout@v4
    - name: Check warnings
      run: |
        cd adapter/cd
        cargo rustc -- -D warnings

  cd-test-warnings:
    needs: [cd-build]
    runs-on: ubuntu-latest
    steps: 
    - uses: actions/checkout@v4
    - name: Check test warnings
      run: |
        cd adapter/cd
        cargo rustc --tests -- -D warnings

  ph-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build + test ph
      run: |
        cd adapter/ph
        make build 
        make test

  ph-format:
    needs: [ph-build]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Check format
      run: |
        cd adapter/ph
        cargo fmt --check

  ph-warnings:
    needs: [ph-build]
    runs-on: ubuntu-latest
    steps: 
    - uses: actions/checkout@v4
    - name: Check warnings 
      run: |
        cd adapter/ph 
        cargo rustc --lib -- -D warnings 
        cargo rustc --bin ph -- -D warnings

  ph-test-warnings:
    needs: [ph-build]
    runs-on: ubuntu-latest
    steps: 
    - uses: actions/checkout@v4
    - name: Check test warnings
      run: | 
        cd adapter/ph
        cargo rustc --tests -- -D warnings

  ph-basic-test:
    needs: [ph-build]
    runs-on: ubuntu-latest
    steps: 
    - uses: actions/checkout@v4
    - name: Check test warnings
      run: |
        cd adapter/ph
        cargo build
        test/basic-test.sh

  ph-capture-test:
    needs: [ph-build, ph-basic-test]
    runs-on: ubuntu-latest
    steps: 
    - uses: actions/checkout@v4
    - name: Check test warnings
      run: |
        cd adapter/ph
        cargo build
        test/bacapturesic-test.sh

  ph-debug-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build + test ph
      run: |
        sudo apt update
        sudo apt install libpcap-dev
        cd adapter/ph-debug && cargo build --verbose
        cargo test --verbose

  ph-debug-format:
    needs: [ph-debug-build]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Check format
      run: |
        cd adapter/ph-debug
        cargo fmt --check

  ph-debug-warnings:
    needs: [ph-debug-build]
    runs-on: ubuntu-latest
    steps: 
    - uses: actions/checkout@v4
    - name: Check warnings 
      run: |
        sudo apt update
        sudo apt install libpcap-dev
        cd adapter/ph-debug && cargo rustc -- -D warnings

  ph-debug-test-warnings:
    needs: [ph-debug-build]
    runs-on: ubuntu-latest
    steps: 
    - uses: actions/checkout@v4
    - name: Check test warnings
      run: |
        sudo apt update
        sudo apt install libpcap-dev
        cd adapter/ph-debug && cargo rustc --tests -- -D warnings
