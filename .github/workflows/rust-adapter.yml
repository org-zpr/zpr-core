name: Rust-adapter

on:
  push:
    branches: [ "main" ]
  pull_request:
    paths:
      - 'adapter/ph/**'
      - 'adapter/ph-debug/**'
      - 'zpr-ext/**'
      - 'cslab/**'
      - 'cbpf-rs/**'
      - '.github/workflows/rust-adapter.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  # Tests for ph
  ph-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
    - uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3 # v2
      with:
        workspaces: |
          adapter/ph
          adapter/ph-debug
          zpr-ext
          cslab
          cbpf-rs

    - name: Setup Git credentials
      timeout-minutes: 1
      run: |
        echo 'echo $ZPR_CICD_RO_TOKEN' > "$HOME/.git-askpass"
        chmod +x "$HOME/.git-askpass"
        echo "GIT_ASKPASS=$HOME/.git-askpass" >> "$GITHUB_ENV"

    - name: Build + test ph
      timeout-minutes: 5
      env:
        ZPR_CICD_RO_TOKEN: ${{ secrets.ZPR_CICD_RO_TOKEN }}
      run: |
        make ph
        cd adapter/ph
        make test

    - name: Check format
      timeout-minutes: 5
      env:
        ZPR_CICD_RO_TOKEN: ${{ secrets.ZPR_CICD_RO_TOKEN }}
      run: |
        cd adapter/ph
        cargo fmt --check

    - name: Check warnings 
      timeout-minutes: 5
      env:
        ZPR_CICD_RO_TOKEN: ${{ secrets.ZPR_CICD_RO_TOKEN }}
      run: |
        cd adapter/ph 
        cargo rustc --bin ph -- -D warnings

    - name: Check test warnings
      timeout-minutes: 5
      env:
        ZPR_CICD_RO_TOKEN: ${{ secrets.ZPR_CICD_RO_TOKEN }}
      run: | 
        cd adapter/ph
        cargo rustc --tests -- -D warnings

  # Tests for ph-debug
  ph-debug-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
    - uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3 # v2
      with:
        workspaces: |
          adapter/ph
          adapter/ph-debug
          zpr-ext
          cslab
          cbpf-rs

    - name: Build + test ph
      timeout-minutes: 5
      run: |
        sudo apt update
        sudo apt install libpcap-dev
        cd adapter/ph-debug && cargo build --verbose
        cargo test --verbose

  ph-debug-format:
    needs: [ph-debug-build]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
    - name: Check format
      timeout-minutes: 5
      run: |
        cd adapter/ph-debug
        cargo fmt --check

  ph-debug-warnings:
    needs: [ph-debug-build]
    runs-on: ubuntu-latest
    steps: 
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
    - name: Check warnings 
      timeout-minutes: 5
      run: |
        sudo apt update
        sudo apt install libpcap-dev
        cd adapter/ph-debug && cargo rustc -- -D warnings

  ph-debug-test-warnings:
    needs: [ph-debug-build]
    runs-on: ubuntu-latest
    steps: 
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
    - name: Check test warnings
      timeout-minutes: 5
      run: |
        sudo apt update
        sudo apt install libpcap-dev
        cd adapter/ph-debug && cargo rustc --tests -- -D warnings

  # Integration tests
  basic-integration-test:
    needs: [ph-build, ph-debug-build]
    runs-on: ubuntu-latest
    steps: 
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
    - uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3 # v2
      with:
        workspaces: |
          adapter/ph
          adapter/ph-debug
          zpr-ext
          cslab
          cbpf-rs

    - name: Build
      timeout-minutes: 10
      run: |
        sudo apt update
        sudo apt install thrift-compiler
        sudo apt install libpcap-dev
        make ph
        make visaservice
        cargo build --manifest-path adapter/ph-debug/Cargo.toml

    - name: One Node v6 Test
      timeout-minutes: 10
      run: |
        ZPR_TEST_VERBOSE=1 integration-test/one-node-v6-test.sh

  capture-integration-test:
    needs: [ph-build, ph-debug-build]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
    - uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3 # v2
      with:
        workspaces: |
          adapter/ph
          adapter/ph-debug
          zpr-ext
          cslab
          cbpf-rs

    - name: Build
      timeout-minutes: 10
      run: |
        sudo apt update
        sudo apt install thrift-compiler
        sudo apt install libpcap-dev
        make ph
        make visaservice
        cargo build --manifest-path adapter/ph-debug/Cargo.toml

    - name: Capture Test
      timeout-minutes: 10
      run: |
        ZPR_TEST_VERBOSE=1 integration-test/capture-test.sh
