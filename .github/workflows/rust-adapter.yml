name: Rust-adapter

on:
  push:
    branches: [ "main" ]
    paths:
      - 'adapter/ph/**'
      - 'adapter/cli/**'
      - 'zpr-ext/**'
      - 'cslab/**'
      - 'cbpf-rs/**'
      - 'libnode/**'
      - '.github/workflows/rust-adapter.yml'
  pull_request:
    paths:
      - 'adapter/ph/**'
      - 'adapter/cli/**'
      - 'zpr-ext/**'
      - 'cslab/**'
      - 'cbpf-rs/**'
      - '.github/workflows/rust-adapter.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  # Build and upload ph
  build-ph:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
    # Necessary to run before rust-cache
    - run: rustup toolchain install stable --profile minimal
    - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2
      with:
        workspaces: |
          adapter/ph
          adapter/cli
          zpr-ext
          cslab
          cbpf-rs

    - name: Setup Git credentials
      timeout-minutes: 1
      run: |
        echo 'echo $ZPR_CICD_RO_TOKEN' > "$HOME/.git-askpass"
        chmod +x "$HOME/.git-askpass"
        echo "GIT_ASKPASS=$HOME/.git-askpass" >> "$GITHUB_ENV"

    - name: Build PH
      timeout-minutes: 5
      env:
        ZPR_CICD_RO_TOKEN: ${{ secrets.ZPR_CICD_RO_TOKEN }}
      working-directory: ./adapter/ph
      run: make

    - name: Package ph
      timeout-minutes: 1
      run: tar -cvf ph.tar adapter/ph/target/debug/ph

    - name: Upload build artifacts
      id: upload
      uses: actions/upload-artifact@v4
      with:
        name: ph-${{ matrix.os }}
        path: ph.tar
        retention-days: 1

  # Test ph, check for warnings, and check formatting
  test-ph:
    needs: [build-ph]
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ./adapter/ph
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
    # Necessary to run before rust-cache
    - run: rustup toolchain install stable --profile minimal
    - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2
      with:
        workspaces: |
          adapter/ph
          adapter/cli
          zpr-ext
          cslab
          cbpf-rs

    - name: Setup Git credentials
      timeout-minutes: 1
      run: |
        echo 'echo $ZPR_CICD_RO_TOKEN' > "$HOME/.git-askpass"
        chmod +x "$HOME/.git-askpass"
        echo "GIT_ASKPASS=$HOME/.git-askpass" >> "$GITHUB_ENV"

    - uses: actions/download-artifact@v4
      with:
        name: ph-${{ matrix.os }}

    - name: Unpack artifacts
      working-directory: ./
      run: tar -xvf ph.tar

    - name: Run PH unit tests
      if: ${{ ! cancelled() }}
      timeout-minutes: 5
      env:
        ZPR_CICD_RO_TOKEN: ${{ secrets.ZPR_CICD_RO_TOKEN }}
      run: make test

    - name: Check format
      if: ${{ ! cancelled() }}
      timeout-minutes: 1
      run: cargo fmt --check

    - name: Check warnings
      if: ${{ ! cancelled() }}
      timeout-minutes: 5
      env:
        ZPR_CICD_RO_TOKEN: ${{ secrets.ZPR_CICD_RO_TOKEN }}
      run: cargo rustc --bin ph -- -D warnings

    - name: Check test warnings
      if: ${{ ! cancelled() }}
      timeout-minutes: 5
      env:
        ZPR_CICD_RO_TOKEN: ${{ secrets.ZPR_CICD_RO_TOKEN }}
      run: cargo rustc --tests -- -D warnings

  # Build and upload ph-cli
  build-ph-cli:
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
    # Necessary to run before rust-cache
    - run: rustup toolchain install stable --profile minimal
    - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2
      env:
        ZPR_CICD_RO_TOKEN: ${{ secrets.ZPR_CICD_RO_TOKEN }}
      with:
        workspaces: |
          adapter/ph
          adapter/cli
          zpr-ext
          cslab
          cbpf-rs

    - name: Install dependencies
      timeout-minutes: 5
      run: |
        echo 'set man-db/auto-update false' | sudo debconf-communicate
        sudo dpkg-reconfigure man-db
        sudo apt install libpcap-dev

    - name: Build ph-cli
      timeout-minutes: 5
      working-directory: ./adapter/cli
      run: cargo build --verbose

    - name: Package ph-cli
      timeout-minutes: 1
      run: tar -cvf ph-cli.tar adapter/cli/target/debug/ph-cli

    - name: Upload build artifacts
      id: upload
      uses: actions/upload-artifact@v4
      with:
        name: ph-cli
        path: ph-cli.tar
        retention-days: 1

  # Test ph-cli, check for warnings, and check formatting
  test-ph-cli:
    needs: [build-ph-cli]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./adapter/cli
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
    # Necessary to run before rust-cache
    - run: rustup toolchain install stable --profile minimal
    - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2
      with:
        workspaces: |
          adapter/ph
          adapter/cli
          zpr-ext
          cslab
          cbpf-rs

    - name: Install dependencies
      timeout-minutes: 5
      run: |
        echo 'set man-db/auto-update false' | sudo debconf-communicate
        sudo dpkg-reconfigure man-db
        sudo apt install libpcap-dev

    - uses: actions/download-artifact@v4
      with:
        name: ph-cli

    - name: Unpack artifacts
      working-directory: ./
      run: tar -xvf ph-cli.tar

    - name: Test ph-cli
      timeout-minutes: 5
      run: cargo test --verbose

    - name: Check format
      if: ${{ ! cancelled() }}
      timeout-minutes: 1
      run: cargo fmt --check

    - name: Check warnings
      if: ${{ ! cancelled() }}
      timeout-minutes: 5
      run: cargo rustc -- -D warnings

    - name: Check test warnings
      if: ${{ ! cancelled() }}
      timeout-minutes: 5
      run: cargo rustc --tests -- -D warnings

  # Integration tests
  basic-integration-test:
    needs: [build-ph, build-ph-cli]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
    # Necessary to run before rust-cache
    - run: rustup toolchain install stable --profile minimal
    - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2
      with:
        workspaces: |
          adapter/ph
          adapter/cli
          zpr-ext
          cslab
          cbpf-rs

    # see <https://github.com/docker-library/golang/issues/452>
    - name: Set workspace as safe
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Setup Git credentials
      timeout-minutes: 1
      run: |
        echo 'echo $ZPR_CICD_RO_TOKEN' > "$HOME/.git-askpass"
        chmod +x "$HOME/.git-askpass"
        echo "GIT_ASKPASS=$HOME/.git-askpass" >> "$GITHUB_ENV"
        go env -w GOPRIVATE="github.com/org-zpr/*"

    - uses: actions/download-artifact@v4
      with:
        pattern: ph-{cli,ubuntu-latest}
        merge-multiple: true

    - name: Build
      timeout-minutes: 10
      env:
        ZPR_CICD_RO_TOKEN: ${{ secrets.ZPR_CICD_RO_TOKEN }}
      run: |
        tar -xvf ph.tar
        tar -xvf ph-cli.tar
        make visaservice

    - name: One Node v6 Test
      timeout-minutes: 10
      run: |
        ZPR_TEST_VERBOSE=1 integration-test/one-node-v6-test.sh

  capture-integration-test:
    needs: [build-ph, build-ph-cli]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
    # Necessary to run before rust-cache
    - run: rustup toolchain install stable --profile minimal
    - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2
      with:
        workspaces: |
          adapter/ph
          adapter/cli
          zpr-ext
          cslab
          cbpf-rs

    # see <https://github.com/docker-library/golang/issues/452>
    - name: Set workspace as safe
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Setup Git credentials
      timeout-minutes: 1
      run: |
        echo 'echo $ZPR_CICD_RO_TOKEN' > "$HOME/.git-askpass"
        chmod +x "$HOME/.git-askpass"
        echo "GIT_ASKPASS=$HOME/.git-askpass" >> "$GITHUB_ENV"
        go env -w GOPRIVATE="github.com/org-zpr/*"

    - uses: actions/download-artifact@v4
      with:
        pattern: ph-{cli,ubuntu-latest}
        merge-multiple: true

    - name: Build
      timeout-minutes: 10
      env:
        ZPR_CICD_RO_TOKEN: ${{ secrets.ZPR_CICD_RO_TOKEN }}
      run: |
        tar -xvf ph.tar
        tar -xvf ph-cli.tar
        cd visaservice && make build-go

    - name: Capture Test
      timeout-minutes: 10
      run: |
        ZPR_TEST_VERBOSE=1 integration-test/capture-test.sh
