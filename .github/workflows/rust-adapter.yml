name: Rust-adapter

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-cd:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build cd
      run: cd adapter/cd && make build

  test-cd:
    needs: build-cd
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Test cd
      run: cd adapter/cd && make test

  build-ph:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build ph
      run: cd adapter/ph && make build

  test-ph:
    needs: build-ph
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Test ph
      run: cd adapter/ph && make test
