name: Rust-visaservice

on:
  push:
    branches: [ "main" ]
  pull_request:
    paths:
      - visaservice/cli/**
      - visaservice/thrift/**
      
env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: install thrift
      run: |
        sudo apt-get install libboost-dev libboost-test-dev libboost-program-options-dev libboost-filesystem-dev libboost-thread-dev libevent-dev automake libtool flex bison pkg-config g++ libssl-dev
        wget https://dlcdn.apache.org/thrift/0.21.0/thrift-0.21.0.tar.gz
        tar -xvf thrift-0.21.0.tar.gz
        cd thrift-0.21.0
        ./bootstrap.sh
        ./configure --without-go --with-rs --without-python --without-java --disable-dependency-tracking
        make
        sudo make install

    - name: Build
      run: |
        cd visaservice
        make all-rs

    - name: Test
      run: |
        cd visaservice
        make test-rs

