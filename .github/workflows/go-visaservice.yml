# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go-visaservice

on:
  push:
    branches: [ "main" ]
  pull_request:
    paths:
      - visaservice/mods/**
      - visaservice/core/**
      - visaservice/thrift/**

jobs:

  setup:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22'

  install_thrift:
     uses: org-zpr/zpr-core/.github/workflows/install-thrift.yml@main

  build_and_test:
    - name: Build
      run: |
        cd visaservice
        make all-go

    - name: Test
      run: |
        cd visaservice
        make test-go
