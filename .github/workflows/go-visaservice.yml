# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go-visaservice

on:
  push:
    branches: [ "main" ]
  pull_request:
    paths:
      - 'visaservice/mods/**'
      - 'visaservice/core/**'
      - 'visaservice/thrift/**'
      - '.github/workflows/go-visaservice.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  setup:
    runs-on: ubuntu-latest
    container:
      image: docker://ghcr.io/org-zpr/38f3bb925e5e:latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

    - name: Build
      timeout-minutes: 5
      run: |
        cd visaservice
        make all-go

    - name: Test
      timeout-minutes: 5
      run: |
        cd visaservice
        make test-go

    - name: Conform
      timeout-minutes: 5
      run: |
        ZPR_TEST_VERBOSE=1 integration-test/vs-conform-test.sh


