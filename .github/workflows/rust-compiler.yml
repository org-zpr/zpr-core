name: Rust-zprext

on:
  push:
    branches: [ "main" ]
  pull_request:
    paths: 
      - 'compiler/**'
      - '.github/workflows/rust-compiler.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  compiler-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
    - name: check warnings etc
      timeout-minutes: 5
      run: |
        cd compiler
        make check

  compiler-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
    - name: run tests
      timeout-minutes: 5
      run: |
        cd compiler
        make test

  compiler-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
    - name: Build 
      timeout-minutes: 5
      run: |
        cd compiler
        make
