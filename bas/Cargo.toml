[package]
name = "bas"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.3"
base64 = "0.22.1"
clap = { version = "4.5.36", features = ["derive"] }
futures-util = "0.3.31"
hmac = "0.12.1"
hyper = "1.6.0"
hyper-util = "0.1.11"
jwt = { version="0.16.0", features = ["openssl"] }
openssl = "0.10.72"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.8"
thiserror = "2.0.12"
tokio = { version = "1.44.2", features = ["full"] }
tokio-native-tls = "0.3.1"
toml = "0.8.20"
tower-service = "0.3.3"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"

[dev-dependencies]
tower = "0.5.2"
tempfile = "3.19.1"
http-body-util = "0.1.3"
http = "1.3.1"
mime = "0.3.17"
serde_urlencoded = "0.7.1"
