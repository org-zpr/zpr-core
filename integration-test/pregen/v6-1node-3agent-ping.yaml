zpl_format: 2

zpr:
  nodes:
    n0:
      # Dock public key
      key: b9oiUhEcvRAhtzqOrl0yY59j/R3mUCxcLiMjdr/d7g0=
      provider:
        - [zpr.adapter.cn, eq, node]
      address: "fd5a:5052::2" # ZPR contact addr
      interfaces:
        n0i0:
          netaddr: "10.0.0.1:12345"
      services:
        - ping
        - visatraffic
      policies:
        - desc: any cert based agent can ping node
          conditions:
            - desc: match on authority
              attrs:
                - [zpr.authority, eq, zpr.adapter]

  visaservice:
    dock: n0
    provider:
      - [zpr.adapter.cn, eq, vs.zpr]
    admin_attrs:
      - [zpr.adapter.cn, eq, client.zpr.org]

  datasources:
    zpr.adapter:
      api: validation/1
      authority:
        encoding: pem
        cert_data: $import[ca-cert.pem]

services:
  visatraffic:
    tcp: 5002
  http:
    tcp: 80
  ssh:
    tcp: 22
  perf:
    tcp: 5056
  ping:
    icmp:
      type: request-response
      type_codes: 128, 129

communications:
  systems:
    basictest:
      desc: ZPR's basic integration test
      components:
        zpr_a:
          desc: Allows pinging the agent at zpr-a
          services:
            - ping
          provider:
            - [zpr.adapter.cn, eq, adapter1]
          address: "fd00:1:1::1" # ZPR contact addr
          policies:
            - desc: zpr_b can access
              conditions:
                - desc: one specific agent has access
                  attrs:
                    - [zpr.adapter.cn, eq, adapter2]
            - desc: zpr_c can access
              conditions:
                - desc: one specific agent has access
                  attrs:
                    - [zpr.adapter.cn, eq, adapter3]
        zpr_b:
          desc: Allows pinging the agent at zpr-b
          services:
            - ping
          provider:
            - [zpr.adapter.cn, eq, adapter2]
          address: "fd00:1:2::1" # ZPR contact addr
          policies:
            - desc: zpr_a can access
              conditions:
                - desc: one specific agent has access
                  attrs:
                    - [zpr.adapter.cn, eq, adapter1]
            - desc: zpr_c can access
              conditions:
                - desc: one specific agent has access
                  attrs:
                    - [zpr.adapter.cn, eq, adapter3]
        zpr_c:
          desc: Allows pinging the agent at zpr-c
          services:
            - ping
          provider:
            - [zpr.adapter.cn, eq, adapter3]
          address: "fd00:1:3::1" # ZPR contact addr
          policies:
            - desc: zpr_a can access
              conditions:
                - desc: one specific agent has access
                  attrs:
                    - [zpr.adapter.cn, eq, adapter1]
            - desc: zpr_b can access
              conditions:
                - desc: one specific agent has access
                  attrs:
                    - [zpr.adapter.cn, eq, adapter2]
