zpl_format: 2

zpr:
  nodes:
    n0:
      # Dock public key
      key: GExPGh5RE/nKo8WoN8EqknDDNIEjWBL6PZm08Uhvn0w=
      provider:
        - [zpr.adapter.cn, eq, node.zpr.org]
      address: "fd5a:5052:90de::1" # ZPR contact addr
      interfaces:
        n0i0:
          netaddr: "192.168.0.55:5000" # POE
      services:
        - ping
      policies:
        - desc: any cert based agent can ping node
          conditions:
            - desc: match on authority
              attrs:
                - [zpr.authority, eq, zpr.adapter]

  visaservice:
    dock: n0
    provider:
      - [zpr.adapter.cn, eq, vs.zpr]
    admin_attrs:
      - [zpr.adapter.cn, eq, client.zpr.org]

  datasources:
    zpr.adapter:
      api: validation/1
      authority:
        encoding: pem
        cert_data: $import[../ca-cert.pem]

services:
  http:
    tcp: 80
  ssh:
    tcp: 22
  perf:
    tcp: 5056
  ping:
    icmp:
      type: request-response
      type_codes: 128, 129

communications:
  systems:
    zprfoo:
      desc: the zprfoo system
      components:
        service_one:
          desc: example service
          services:
            - http
            - perf
            - ping
          provider:
            - [zpr.adapter.cn, eq, service.zpr.org]
          address: "fd5a:5052:1::8080" # ZPR contact addr
          policies:
            - desc: specific client can access
              conditions:
                - desc: one specific agent has access
                  attrs:
                    - [zpr.adapter.cn, eq, client.zpr.org]
