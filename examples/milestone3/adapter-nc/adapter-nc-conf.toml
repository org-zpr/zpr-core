[global]
name = "nc"
ca_file = "auth-ca.crt"
certificate_file = "adapter-nc-noise.crt"
private_key_file = "adapter-nc-noise.key"
agent_addr = [ "fd5a:5052:1::9" ] 
self_addr = "0.0.0.0:5000"

# use `sudo ./mktun.sh` to set this up
tun_if = "tun9"


[adapter]
node_addr = "10.0.0.21:5000"
node_public_key_file = "node-noise-pub.pem"









