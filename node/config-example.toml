# Example node configuration file.

# node_name must match the ZPL
node_name = "n0"

[creds]
ca_certificate = "ca-cert.pem"
noise_certificate = "node-noise-cert.pem"
noise_private_key = "<base64 encoded noise private key here>"

[dock]
enabled = true
listen_address = "0.0.0.0:5000"


[claims]
"zpr.addr" = "fc00:3001:abd5::3836"
"x509.cn" = "node.zpr"


