# zpr-core
[workspace]
resolver = "3"
members = ["adapter/admin-api", "adapter/ph", "adapter/cli", "libnode2", "cbpf-rs", "cbpf-rs/fuzz", "cslab", "zpr-ext", "zpr-utils"]

[workspace.dependencies]
bytes = "1.11.1"
capnp = { version = "0.25.0", features = ["sync_reader"] }
capnp-rpc = "0.25.0"
clap = { version = "4.5.23", features = ["derive"] }
clap_complete = "4.5.57"
ipnet = "2.11.0"
libc = "0.2.175"
nix = "0.29.0"
openssl = "0.10.74"
pcap = "2.0.0"
socket2 = "0.5.7"
strum = { version = "0.27.1", features = ["derive"] }
thiserror = "2.0.18"
tokio = { version = "1.48.0", features = ["full"] }
tokio-util = { version = "0.7.17", features = ["rt", "compat"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
zerocopy = { version = "0.8.3", features = ["derive", "std"] }
zpr = { git = "https://github.com/org-zpr/zpr-common.git", tag = "v0.9.0", features = ["vsapi", "policy"] }

[profile.release]
panic = "abort"
